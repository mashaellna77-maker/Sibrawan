[project]
name = "sibrawan-capstone"
version = "0.1.0"
description = "Sibrawan: synthetic phishing incidents and quarterly response capacity"
requires-python = ">=3.11,<3.14"
dependencies = [
    # nixtlaverse — statsforecast brings utilsforecast + coreforecast with it
    "statsforecast==2.1.1",
    # classical stats: STL, ACF, R-datasets
    "statsmodels==0.15.0",
    "pandas>=2.2",
    "numpy>=2.0",
    # plotting (seaborn: course style in coursekit.plotting)
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

# AutoGluon (section 3, "your model") is deliberately not a core
# dependency: it pulls torch (~2.5 GB). Install it in the notebook:
#     !pip install -q autogluon.timeseries

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coursekit"]
